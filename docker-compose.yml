# Phase 4: adds Postgres (job/document/result persistence), Redis + a
# Celery worker (background comparison processing), and MinIO (object
# storage for uploaded files) alongside the Phase 1-3 backend/frontend.
#
# `docker compose up --build` still gets you the whole thing with one
# command — now that's five services instead of two, wired together with
# healthchecks so nothing starts before its dependencies are ready.

x-backend-env: &backend-env
  PYTHONUNBUFFERED: "1"
  DATABASE_URL: postgresql+psycopg2://doccompare:doccompare@postgres:5432/doccompare
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: doccompare
  MINIO_SECRET_KEY: doccompare123
  MINIO_BUCKET: doccompare-uploads
  MINIO_SECURE: "false"
  STORAGE_BACKEND: minio

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: doccompare
      POSTGRES_PASSWORD: doccompare
      POSTGRES_DB: doccompare
    ports:
      - "5433:5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doccompare"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: doccompare
      MINIO_ROOT_PASSWORD: doccompare123
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console — visit http://localhost:9001 to browse uploads
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Same image as `backend`, different command: this is the actual process
  # that runs comparisons. `watchmedo` restarts it automatically when
  # backend/app/*.py changes, mirroring the hot-reload behavior uvicorn
  # gives the API for free — Celery doesn't have that built in.
  worker:
    build:
      context: ./backend
      target: dev
    command: >
      watchmedo auto-restart --directory=./app --pattern=*.py --recursive --
      celery -A app.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
      args:
        # Browser-side fetches hit localhost, NOT the "backend" service
        # name — NEXT_PUBLIC_* code runs in the user's browser, which
        # knows nothing about the Docker network.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
